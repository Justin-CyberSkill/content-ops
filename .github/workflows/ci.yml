name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the app builds; nothing in CI talks to a real database yet.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrate:
    # Apply committed migrations to production Neon after CI passes on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      # Neon direct (non-pooler) URL. Add it under Settings > Secrets and variables > Actions.
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Skip when the production database secret is not set
        id: guard
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::notice::DATABASE_URL_UNPOOLED secret not set; skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm db:migrate
